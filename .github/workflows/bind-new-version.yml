# CI half of the patcher: when a new Claude Code build ships, this job
# downloads it, runs the oracle binder (measured, never guessed), and - only
# for a binding that passed the end-to-end test - publishes the record as the
# GitHub release `auto-mode-timeout-<version>` (asset verified_site.json =
# the entry verbatim). Users then run patch.sh, which fetches exactly that
# release and applies it - no probe. Nothing binding-related is tracked in
# the repository any more: a failed binding emits no artifact and publishes
# nothing, by construction.
#
# Dispatched via workflow_dispatch - by the release-watch Cloudflare Worker
# (worker/release-watch.js) whenever a new version ships on the release feed,
# or by hand. Binding costs 20-60 min of blackhole probes, so it runs one
# version per run; a re-run on an already-bound version (its release exists)
# is a no-op.
#
# The release is published only if the recorded entry passes the end-to-end
# test (the ~150 s wait, paid here instead of on the users' machines): the
# entry is applied through the canonical apply path and probed at the 150 s
# cap (rc=124, still waiting, is the pass). When it fails, up to 5 other
# found values are tried the same way (candidate fallback, ~5-8 min each);
# every failure emits no artifact and the publish step is skipped.
#
# The binary_url input is the version's linux-x64 build. The release asset
# claude-linux-x64.tar.gz (verified shape: a single `claude` member) is the
# default - the worker resolves it from a BINARY_URL_TEMPLATE - and
# tools/ci_bind_new_version.py's download_version() unpacks a tarball answer (the
# member is identified, never guessed), so the URL stays a data input.
name: Bind new Claude Code version
run-name: Bind ${{ inputs.version || github.event.client_payload.version }} version

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Claude Code version to bind (names the release, e.g. 2.1.273)"
        required: true
        default: ""
      binary_url:
        description: "URL of that version's linux-x64 binary (empty = refused)"
        required: false
        default: ""
  repository_dispatch:
    types: [kick-off-patcher]

permissions:
  contents: write

jobs:
  bind:
    runs-on: ubuntu-latest
    # 20-60 min primary binding + up to 5 candidate-fallback attempts
    # (~5-8 min each, longer on capped builds) + the end-to-end probes.
    timeout-minutes: 240
    # Dispatch inputs are untrusted: pass them through env (set by GitHub as data)
    # and reference them as shell vars below - never interpolate into run:.
    env:
      VERSION: ${{ inputs.version || github.event.client_payload.version }}
      BINARY_URL: ${{ inputs.binary_url || github.event.client_payload.binary_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bind the version (record + end-to-end test)
        # The script only exits 0 when a binding passed the end-to-end test
        # (or the release already exists); it emits the release artifact
        # (publish/verified_site.json + title + notes) only in that case -
        # the publish step below runs only when the artifact was emitted.
        run: |
          python3 tools/ci_bind_new_version.py \
            --version "$VERSION" \
            --download-url "$BINARY_URL" \
            --max-candidates 5 \
            --out "$GITHUB_WORKSPACE/publish"

      - name: Publish the release
        # gh release create with the GITHUB_TOKEN (contents: write is
        # granted above). A failed binding never emits the artifact, so
        # there is structurally nothing to publish for one.
        if: hashFiles('publish/verified_site.json')
        run: |
          # The asset is a positional argument of `gh release create`
          # (the form every gh version understands).
          gh release create "auto-mode-timeout-$VERSION" \
            --title "$(cat publish/release_title.txt)" \
            --notes-file publish/release_notes.md \
            publish/verified_site.json
